; NahaLabs Asterisk dialplan

[from-mobile]
exten => s,1,NoOp(Naha inbound call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(NAHA_SOCKET_UUID=${UUID()})
 same => n,System(/usr/local/bin/naha-call-context set "${NAHA_SOCKET_UUID}" "")
 same => n,System(/usr/local/bin/naha-notify-event inbound "${CALLERID(num)}" "${NAHA_EVENT_TARGET}" >/dev/null 2>&1 &)
 same => n,AudioSocket(${NAHA_SOCKET_UUID},127.0.0.1:9092)
 same => n,System(/usr/local/bin/naha-call-context clear "${NAHA_SOCKET_UUID}" >/dev/null 2>&1 || true)
 same => n,Hangup()

[naha-outbound]
exten => s,1,NoOp(Naha outbound call to ${NAHA_DESTINATION})
 same => n,Answer()
 same => n,Set(NAHA_SOCKET_UUID=${UUID()})
 same => n,System(/usr/local/bin/naha-call-context set "${NAHA_SOCKET_UUID}" "${NAHA_INSTRUCTIONS_B64}" >/dev/null 2>&1)
 same => n,System(/usr/local/bin/naha-notify-event outbound "${NAHA_DESTINATION}" "${NAHA_EVENT_TARGET}" >/dev/null 2>&1 &)
 same => n,AudioSocket(${NAHA_SOCKET_UUID},127.0.0.1:9092)
 same => n,System(/usr/local/bin/naha-call-context clear "${NAHA_SOCKET_UUID}" >/dev/null 2>&1 || true)
 same => n,Hangup()
