; NahaLabs Asterisk dialplan

[from-mobile]
exten => s,1,NoOp(Naha inbound call from ${CALLERID(num)})
 same => n,Answer()
 same => n,System(/usr/local/bin/naha-notify-event inbound "${CALLERID(num)}" "${NAHA_EVENT_TARGET}" >/dev/null 2>&1 &)
 same => n,AudioSocket(${CHANNEL(uniqueid)},127.0.0.1:9092)
 same => n,Hangup()

[naha-outbound]
exten => s,1,NoOp(Naha outbound call to ${NAHA_DESTINATION})
 same => n,Answer()
 same => n,System(/usr/local/bin/naha-notify-event outbound "${NAHA_DESTINATION}" "${NAHA_EVENT_TARGET}" >/dev/null 2>&1 &)
 same => n,AudioSocket(${CHANNEL(uniqueid)},127.0.0.1:9092)
 same => n,Hangup()
