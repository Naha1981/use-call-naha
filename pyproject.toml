[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "call-use"
dynamic = ["version"]
description = "Open-source call-control runtime with regional and local telephony adapters"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "agent-next"}]
keywords = ["ai", "phone", "call", "voice", "telephony", "asterisk", "modemmanager"]
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.4",
    "livekit-plugins-openai~=1.4",
    "livekit-plugins-deepgram~=1.4",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "httpx",
    "click>=8.0",
    "mcp[server]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx", "mypy", "hypothesis", "numpy>=2.0,<2.5"]
local-voice = ["numpy>=2.0,<2.5", "faster-whisper>=1.1", "piper-tts>=1.2", "webrtcvad-wheels>=2.0.14"]
desktop = ["numpy>=2.0,<2.5", "Pillow>=11", "mss>=10", "pynput>=1.8", "pyautogui>=0.9", "sounddevice>=0.5", "faster-whisper>=1.1", "piper-tts>=1.2", "webrtcvad-wheels>=2.0.14"]
docs = ["mkdocs-material>=9.0", "mkdocstrings[python]>=0.24"]

[project.scripts]
call-use-worker = "call_use.agent:main"
call-use = "call_use.cli:main"
call-use-mcp = "call_use.mcp_server:main"
naha-audiosocket = "call_use.audiosocket_agent:main"

[project.urls]
Homepage = "https://github.com/agent-next/call-use"
Repository = "https://github.com/Naha1981/use-call-naha"
Issues = "https://github.com/Naha1981/use-call-naha/issues"

[tool.setuptools.dynamic]
version = {attr = "call_use._version.__version__"}

[tool.setuptools.packages.find]
include = ["call_use*"]

[tool.setuptools.package-data]
call_use = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "bdd: Behavior-driven scenario tests",
    "integration: Integration tests",
]

[tool.coverage.run]
omit = [
    "call_use/asterisk.py",
    "call_use/local_voice.py",
    "call_use/audiosocket_agent.py",
    "call_use/desktop_control.py",
    "call_use/desktop_bridge.py",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
